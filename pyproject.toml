[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cem-framework"
version = "0.1.0"
description = "Composable, auditable correction-element solver primitives"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["solver", "estimators_1d", "p1_poisson_hat"]

[tool.setuptools.packages.find]
where = ["src"]
