[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cem-framework"
version = "0.1.0"
description = "Composable, auditable correction-element solver primitives"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
scipy = ["scipy>=1.10"]
torch = ["torch>=2.0"]

[tool.setuptools]
packages = ["cem_framework"]
package-dir = {cem_framework = "."}
